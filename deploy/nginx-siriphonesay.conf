# Nginx site for the Siriphonesay Construction website
# Copy to /etc/nginx/sites-available/siriphonesay and link it into sites-enabled.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # add your domain here later, e.g.  server_name siriphonesay.com www.siriphonesay.com;
    server_name _;

    root /var/www/siriphonesay;
    index index.html;

    # compress text and 3D models (house models shrink by about half)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml model/gltf-binary model/gltf+json application/octet-stream;

    # 3D models and images: cache for a long time
    location ~* \.(glb|gltf|webp|jpg|jpeg|png|svg|ico|woff2?)$ {
        types { model/gltf-binary glb; model/gltf+json gltf; image/webp webp; image/jpeg jpg jpeg; image/png png; image/svg+xml svg; image/x-icon ico; font/woff2 woff2; }
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # app files have content hashes in their names: cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # single-page app: every page address loads index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 50m;
}
