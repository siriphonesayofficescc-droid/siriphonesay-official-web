# Siriphonesay website as a small Nginx container on the shared "web" network.
# It has NO public ports: the Caddy proxy (hashang/deploy/caddy) forwards to it.
services:
  web:
    image: nginx:1.29-alpine
    container_name: siriphonesay-web
    restart: unless-stopped
    volumes:
      - ./www:/srv:ro   # www/site = live version, www/site.old = previous
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

networks:
  web:
    external: true
